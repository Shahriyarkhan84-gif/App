# Minimal Supabase CLI config. Run `supabase init` to generate the full file
# if you want to run the local stack; these sections are the parts we rely on.
project_id = "zynalive"

[auth.third_party.clerk]
enabled = true
# Your Clerk Frontend API domain, e.g. "example.clerk.accounts.dev"
domain = "env(CLERK_DOMAIN)"

# Edge functions verify the Clerk session JWT themselves (_shared/auth.ts);
# webhooks are verified with their provider's signing secret.
[functions.livekit-token]
verify_jwt = false
[functions.livekit-webhook]
verify_jwt = false
[functions.coins-checkout]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
[functions.clerk-webhook]
verify_jwt = false
[functions.didit-session]
verify_jwt = false
[functions.didit-webhook]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
