# Minimal Supabase CLI config. Run `supabase init` to generate the full file
# if you want to run the local stack; these sections are the parts we rely on.
project_id = "zynalive"

[auth.third_party.clerk]
enabled = true
# Your Clerk Frontend API domain, e.g. "example.clerk.accounts.dev"
domain = "env(CLERK_DOMAIN)"

# Edge functions verify the Clerk session JWT themselves (_shared/auth.ts);
# webhooks are verified with their provider's signing secret.
[functions.livekit-token]
verify_jwt = false
[functions.livekit-webhook]
verify_jwt = false
[functions.coins-checkout]
verify_jwt = false
[functions.stripe-webhook]
verify_jwt = false
[functions.clerk-webhook]
verify_jwt = false
[functions.didit-session]
verify_jwt = false
[functions.didit-webhook]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.host-application]
verify_jwt = false
[functions.livekit-enforce]
verify_jwt = false
[functions.payments-reconcile]
verify_jwt = false
[functions.smart-search]
verify_jwt = false
[functions.apk-publish]
verify_jwt = false
[functions.config-status]
verify_jwt = false
[functions.pay-session]
verify_jwt = false
[functions.live-record]
verify_jwt = false
[functions.iap-verify]
verify_jwt = false
[functions.store-notifications]
verify_jwt = false
[functions.push-send]
verify_jwt = false
[functions.recharge]
verify_jwt = false
[functions.payouts-send]
verify_jwt = false
