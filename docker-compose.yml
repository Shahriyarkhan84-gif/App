services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zynalive
      POSTGRES_PASSWORD: zynalive
      POSTGRES_DB: zynalive
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://zynalive:zynalive@postgres:5432/zynalive?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      PORT: 4000
    ports: ["4000:4000"]
    depends_on: [postgres, redis]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
